name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test from an empty Maven repository
        run: |
          fresh_maven_repository="$(mktemp -d)"
          mvn -B -U -Dmaven.repo.local="$fresh_maven_repository" -Dproguard.skip=true test
      - run: python3 scripts/translate-locales.py --check
