# Shared chat prefix. Every message references it as {prefix}, so you can
# rebrand or recolor the whole plugin from this one line.
prefix: "&8[&x&0&0&F&F&A&ANeoMod&8]"
error:
  no-permission: "{prefix} &cYou do not have permission to use NeoModeration."
  no-api-key: "{prefix} &cNo API key configured. Please run &e/nmod setup <apiKey>"
  api-key-too-long: "{prefix} &cAPI key is too long (max {max} characters)."
  rule-too-long: "{prefix} &cValue is too long (max {max} characters)."
help:
  title: "&8&m----------&r &x&0&0&F&F&A&A&lNeoModeration &8&m----------"
  section:
    start: "&f&lGetting started"
    rules: "&f&lRules & actions"
    tools: "&f&lTools"
    admin: "&f&lAdmin"
  entry: " &b{usage} &8- &7{desc}"
  footer: "&8&m--------------------------------------"
  usage:
    setup: "/nmod setup <key>"
    status: "/nmod status"
    mode: "/nmod mode"
    preset: "/nmod preset"
    word: "/nmod word"
    url: "/nmod url"
    allow: "/nmod allow"
    action: "/nmod action"
    test: "/nmod test <msg>"
    doctor: "/nmod doctor"
    cases: "/nmod cases"
    usage: "/nmod usage"
    privacy: "/nmod privacy"
    key: "/nmod key"
    reload: "/nmod reload"
    on: "/nmod on"
    off: "/nmod off"
  desc:
    help: "show this menu"
    setup: "enable cloud moderation"
    status: "protection at a glance"
    mode: "monitor or enforce"
    preset: "apply a policy bundle"
    word: "banned words"
    url: "banned links"
    allow: "exceptions that always win"
    action: "punishments on detect"
    test: "preview a decision"
    doctor: "diagnose your setup"
    cases: "detection history"
    usage: "cloud credits and limits"
    privacy: "what data goes where"
    key: "set or clear the API key"
    reload: "reload config from disk"
    on: "enable moderation"
    off: "disable moderation"
setup:
  usage: "{prefix} &cUsage: &e/{label} setup <apiKey>"
  done: "{prefix} &a&lSuccess! &7Cloud moderation is now &aactive&7. Chat is being scanned."
toggle:
  on: "{prefix} &7Moderation has been &aENABLED&7."
  off: "{prefix} &7Moderation has been &cDISABLED&7."
key:
  usage: "{prefix} &cUsage: &e/{label} key <set|clear> [apiKey]"
  saved: "{prefix} &aAPI key saved successfully."
  cleared: "{prefix} &eAPI key removed. Only local rules will apply."
status:
  title: "&8&m----------&r &x&0&0&F&F&A&A&lNeoModeration Status &8&m----------"
  enabled: "&7Status: &f{value}"
  mode: "&7Mode: &f{value}"
  cloud: "&7Protection: &f{value}"
  rules: "&7Local rules: &b{words} &7words, &b{urls} &7links"
  allow: "&7Exceptions: &b{words} &7allowed phrases, &b{urls} &7allowed links"
  actions: "&7On detect: &c{value}"
  alerts: "&7Staff alerts: &f{value}"
  coverage: "&7Anti-spam: &f{spam} &8| &7Strikes: &f{strikes} &8| &7Surfaces: &f{surfaces}/4 &8| &7Cases: &f{cases}"
  detections: "&7Detections since startup: &b{value}"
reload:
  done: "{prefix} &aConfiguration reloaded successfully."
rules:
  usage: "{prefix} &cUsage: &e/{label} {kind} <add|remove|list> [value]"
  list: "{prefix} &7Blocked {kind}s: &b{values}"
  value-required: "{prefix} &cPlease specify a value to add or remove."
  updated: "{prefix} &a{action} {kind}: &f{value}"
  unchanged: "{prefix} &eNo changes made for {kind}: &f{value}"
action:
  usage: "{prefix} &cUsage: &e/{label} action <list|add|remove|reset>"
  add-usage: "{prefix} &cUsage: &e/{label} action add <clear|mute|kick|ban> [duration]"
  remove-usage: "{prefix} &cUsage: &e/{label} action remove <clear|mute|kick|ban>"
  list-title: "&8&m----------&r &c&lPunishment Actions &8&m----------"
  list-item: "&7{index}. &c{value}"
  empty: "{prefix} &eNo actions configured. Messages will be blocked without punishment."
  added: "{prefix} &aAction added: &f{value}"
  removed: "{prefix} &eAction removed: &f{value}"
  missing: "{prefix} &cThat action is not currently configured: &f{value}"
  unknown: "{prefix} &cUnknown action. &7Use clear, mute, kick, or ban."
  bad-duration: "{prefix} &cInvalid duration: &f{value}&c. &7Try 30s, 5m, or 1h (max 30d)."
  reset: "{prefix} &aActions have been reset to &fclear &aand &fmute 5m&a."
usage:
  fetching: "{prefix} &7Fetching usage from NeoMechanical..."
  title: "&8&m----------&r &x&0&0&F&F&A&A&lNeoMechanical Usage &8&m----------"
  workspace: "&7Workspace: &f{value}"
  plan: "&7Plan: &f{value} &8(&f{rpm}&7/min limit&8)"
  credits: "&7Credits left: &a{value}"
  requests: "&7Requests: &f{today} &7today &8/ &f{week} &7last 7 days"
  nsfw: "&7NSFW today (left/cap): &f{images} &7img, &f{text} &7txt, &f{videos} &7vid"
  error: "{prefix} &cFailed to fetch API usage. Check your key or try again later."
mapart:
  confiscated: "{prefix} &cThat map contains inappropriate content and has been removed."
  blocked: "{prefix} &cThat map is flagged as inappropriate and cannot be used."
mute:
  blocked: "&cYou are muted for &f{duration}&c."
alert:
  monitor: "{prefix} &e&lMONITOR &7{player} &8[&7{surface}&8] &f{message} &8(&7{reason}&8) &7would trigger: &e{actions}"
  enforce: "{prefix} &c&lFLAGGED &7{player} &8[&7{surface}&8] &f{message} &8(&7{reason}&8) &7-> &c{actions}"
surface:
  blocked: "{prefix} &cThat text contains blocked content."
allow:
  usage: "{prefix} &cUsage: &e/{label} allow <word|url> <add|remove|list> [value]"
mode:
  usage: "{prefix} &cUsage: &e/{label} mode <monitor|enforce>"
  current: "{prefix} &7Mode: &f{value}"
  stats: "{prefix} &7Detections since startup (&f{hours}h&7): &b{total}"
  stats-line: "&8  - &7{reason}: &b{count}"
  set-monitor: "{prefix} &eMonitor mode on. &7Detections are logged and alerted, but nothing is blocked or punished. Use &e/nmod mode enforce &7when ready."
  set-enforce: "{prefix} &aEnforce mode on. &7Flagged content is now blocked and configured actions run."
test:
  usage: "{prefix} &cUsage: &e/{label} test <message>"
  title: "{prefix} &7Testing: &f{message}"
  disabled: "{prefix} &7Moderation is &cdisabled&7, so the message would not be checked."
  local-flagged: "{prefix} &7Local rules: &cFLAGGED &8(&7{reason}&8)"
  local-clear: "{prefix} &7Local rules: &aclear"
  cloud-checking: "{prefix} &7Cloud: &7checking..."
  cloud-flagged: "{prefix} &7Cloud: &cFLAGGED &8(&7{ms}ms&8)"
  cloud-clear: "{prefix} &7Cloud: &aclear &8(&7{ms}ms&8)"
  cloud-error: "{prefix} &7Cloud: &cerror &8(&7{detail}, {ms}ms&8)"
  cloud-skipped-local: "{prefix} &7Cloud: &8skipped (local rules already detected it)"
  cloud-skipped-key: "{prefix} &7Cloud: &8skipped (no API key; local rules only)"
  cloud-skipped-circuit: "{prefix} &7Cloud: &8skipped (paused after errors; /nmod reload to retry)"
  would-allowed: "{prefix} &7Result: &aallowed"
  would-monitor: "{prefix} &7Result: &emonitor alert only &7(no blocking or punishment)"
  would-enforce: "{prefix} &7Result: &cblocked&7; actions: &c{actions}"
  note: "{prefix} &8This test used one cloud request. No actions were executed."
doctor:
  title: "&8&m----------&r &x&0&0&F&F&A&A&lNeoModeration Doctor &8&m----------"
  pass: "&a[OK] &7{check}&8: &f{detail}"
  warn: "&e[!!] &7{check}&8: &f{detail}"
  fail: "&c[XX] &7{check}&8: &f{detail}"
  checking-cloud: "{prefix} &7Checking cloud connectivity..."
privacy:
  title: "&8&m----------&r &x&0&0&F&F&A&A&lNeoModeration Privacy &8&m----------"
  headline: "&7Protection: &f{value}"
  local: "&7Word/URL rules run on this server. That chat never leaves it."
  cloud: "&7With an API key, flagged-checked chat and map images are sent to &f{endpoint} &7with the player name and UUID."
  no-cloud: "&7No API key is set, so no chat or map content is sent off this server."
  retention: "&7Cloud requests use &fno_store&7: not retained, not used for training, no analysis details returned."
  timeout: "&7Cloud waits: &f{connect}ms &7connect, &f{read}ms &7read (2.5s hard cap). If unreachable: &f{policy}&7."
  mode: "&7Mode: &f{value}"
  metrics: "&7bStats technical metrics contain no chat content and can be disabled in &fplugins/bStats/config.yml&7."
cases:
  title: "&8&m----------&r &x&0&0&F&F&A&A&lRecent Cases &8&m----------"
  line: "&8#&b{id} &7{player} &8[&7{surface}&8] &7{reason} &8-> &c{actions} &8({mode}, {ago} ago)"
  preview: " &8> &f{value}"
  empty: "{prefix} &7No cases recorded yet."
  not-found: "{prefix} &cNo case with id &f{id}&c."
  disabled: "{prefix} &7Case history is disabled (moderation.cases.enabled)."
  unavailable: "{prefix} &cCase history is unavailable on this server (no SQLite driver)."
preset:
  usage: "{prefix} &cUsage: &e/{label} preset <family|community|minimal>"
  list-title: "&8&m----------&r &x&0&0&F&F&A&A&lPolicy Presets &8&m----------"
  list-item: "&b{name} &8- &7{summary}"
  applied: "{prefix} &aApplied preset &f{name}&a. &7Cloud categories on: &b{categories}&7, actions: &c{actions}&7. Mode and local rules were not changed."
