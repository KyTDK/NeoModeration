# Prefijo compartido del chat. Todos los mensajes lo usan como {prefix}.
prefix: "&8[&x&0&0&F&F&A&ANeoMod&8]"
error:
  no-permission: "{prefix} &cNo tienes permiso para usar NeoModeration."
  no-api-key: "{prefix} &cNo hay clave API. &7Regístrate en &f{url}&7, crea una clave y ejecuta &e/nmod setup <apiKey>"
  api-key-too-long: "{prefix} &cLa clave API es demasiado larga (máx {max})."
  rule-too-long: "{prefix} &cEl valor es demasiado largo (máx {max})."
help:
  title: "&8&m----------&r &x&0&0&F&F&A&A&lNeoModeration &8&m----------"
  section:
    start: "&f&lPrimeros pasos"
    rules: "&f&lReglas y acciones"
    tools: "&f&lHerramientas"
    admin: "&f&lAdministración"
  entry: " &b{usage} &8- &7{desc}"
  footer: "&8&m--------------------------------------"
  usage:
    setup: "/nmod setup <clave>"
    status: "/nmod status"
    mode: "/nmod mode"
    preset: "/nmod preset"
    word: "/nmod word"
    url: "/nmod url"
    allow: "/nmod allow"
    action: "/nmod action"
    test: "/nmod test badword"
    doctor: "/nmod doctor"
    cases: "/nmod cases"
    usage: "/nmod usage"
    privacy: "/nmod privacy"
    key: "/nmod key"
    reload: "/nmod reload"
    on: "/nmod on"
    off: "/nmod off"
  desc:
    help: "mostrar este menú"
    setup: "activar moderación en la nube"
    status: "protección de un vistazo"
    mode: "monitor o enforce"
    preset: "aplicar un paquete de políticas"
    word: "palabras bloqueadas"
    url: "enlaces bloqueados"
    allow: "excepciones que siempre ganan"
    action: "castigos al detectar"
    test: "probar la regla incluida; nunca actúa"
    doctor: "diagnosticar la configuración"
    cases: "historial de detecciones"
    usage: "créditos y límites de nube"
    privacy: "qué datos van a dónde"
    key: "guardar o borrar la clave API"
    reload: "recargar la configuración"
    on: "activar moderación"
    off: "desactivar moderación"
setup:
  usage: "{prefix} &cUso: &e/{label} setup <apiKey>"
  done: "{prefix} &aClave API guardada. &7Ejecuta &e/nmod doctor &7para verificar autenticación y créditos y luego &e/nmod test hello&7. Las pruebas nunca ejecutan acciones."
toggle:
  on: "{prefix} &7Moderación &aACTIVADA&7."
  off: "{prefix} &7Moderación &cDESACTIVADA&7."
key:
  usage: "{prefix} &cUso: &e/{label} key <set|clear> [apiKey]"
  saved: "{prefix} &aClave API guardada. &7Ejecuta &e/nmod doctor &7para verificar autenticación y créditos y luego &e/nmod test hello&7."
  cleared: "{prefix} &eClave API eliminada. Solo reglas locales."
status:
  title: "&8&m----------&r &x&0&0&F&F&A&A&lEstado NeoModeration &8&m----------"
  enabled: "&7Estado: &f{value}"
  mode: "&7Modo: &f{value}"
  cloud: "&7Protección: &f{value}"
  cloud-no-key: "&7Configuración de nube: &esin clave&7. Regístrate en &f{url}&7, crea una clave y ejecuta &e/nmod setup <key>&7."
  cloud-unverified: "&7Estado de eventos de moderación: &esin verificar desde el inicio/recarga&7. Ejecuta &e/nmod test hello&7."
  cloud-ready: "&7Estado de eventos de moderación: &ala última solicitud funcionó&7. Ejecuta &e/nmod usage &7para ver los créditos de la cuenta."
  cloud-auth: "&7Estado de eventos de moderación: &cclave API rechazada&7. Sustitúyela en &f{keysUrl}&7 y ejecuta &e/nmod setup <key>&7."
  cloud-credits: "&7Estado de eventos de moderación: &ccréditos insuficientes&7. Añade créditos en &f{billingUrl}&7 y ejecuta &e/nmod test hello&7."
  cloud-request-error: "&7Estado de eventos de moderación: &csolicitud rechazada&7, pero la clave no se clasificó como inválida. Revisa el endpoint con &e/nmod doctor&7 y ejecuta &e/nmod test hello&7."
  cloud-transient: "&7Estado de eventos de moderación: &eerror temporal de red/servidor&7. Las reglas locales siguen activas; usa &e/nmod reload &7para reintentar un circuito pausado."
  rules: "&7Reglas locales: &b{words} &7palabras, &b{urls} &7enlaces"
  allow: "&7Excepciones: &b{words} &7frases permitidas, &b{urls} &7enlaces permitidos"
  actions: "&7Al detectar: &c{value}"
  alerts: "&7Alertas al staff: &f{value}"
  coverage: "&7Anti-spam: &f{spam} &8| &7Strikes: &f{strikes} &8| &7Superficies: &f{surfaces}/4 &8| &7Casos: &f{cases}"
  detections: "&7Detecciones desde el inicio: &b{value}"
reload:
  done: "{prefix} &aConfiguración recargada."
rules:
  usage: "{prefix} &cUso: &e/{label} {kind} <add|remove|list> [valor]"
  list: "{prefix} &7{kind}s bloqueados: &b{values}"
  value-required: "{prefix} &cIndica un valor."
  updated: "{prefix} &a{action} {kind}: &f{value}"
  unchanged: "{prefix} &eSin cambios para {kind}: &f{value}"
action:
  usage: "{prefix} &cUso: &e/{label} action <list|add|remove|reset>"
  add-usage: "{prefix} &cUso: &e/{label} action add <clear|mute|kick|ban> [duración]"
  remove-usage: "{prefix} &cUso: &e/{label} action remove <clear|mute|kick|ban>"
  list-title: "&8&m----------&r &c&lAcciones &8&m----------"
  list-item: "&7{index}. &c{value}"
  empty: "{prefix} &eSin acciones. El mensaje se bloquea sin castigo."
  added: "{prefix} &aAcción añadida: &f{value}"
  removed: "{prefix} &eAcción eliminada: &f{value}"
  missing: "{prefix} &cEsa acción no está configurada: &f{value}"
  unknown: "{prefix} &cAcción desconocida. &7Usa clear, mute, kick o ban."
  bad-duration: "{prefix} &cDuración inválida: &f{value}&c. &7Prueba 30s, 5m o 1h (máx 30d)."
  reset: "{prefix} &aAcciones restablecidas a &fclear &ay &fmute 5m&a."
usage:
  fetching: "{prefix} &7Consultando uso en NeoMechanical..."
  title: "&8&m----------&r &x&0&0&F&F&A&A&lUso de NeoMechanical &8&m----------"
  workspace: "&7Espacio: &f{value}"
  plan: "&7Plan: &f{value} &8(&f{rpm}&7/min límite&8)"
  credits: "&7Créditos restantes: &a{value}"
  credits-empty: "&7Créditos restantes: &c0&7. Añade créditos en &f{url}&7 y ejecuta &e/nmod test hello&7."
  requests: "&7Solicitudes: &f{today} &7hoy &8/ &f{week} &7últimos 7 días"
  nsfw: "&7NSFW hoy (rest./máx): &f{images} &7img, &f{text} &7txt, &f{videos} &7vid"
  error: "{prefix} &cNo se pudo obtener el uso por un error temporal de red/servidor. &7Inténtalo más tarde."
  error-auth: "{prefix} &cLa clave API fue rechazada. &7Sustitúyela en &f{keysUrl}&7 y ejecuta &e/nmod setup <key>&7."
  error-credits: "{prefix} &cCréditos insuficientes. &7Añade créditos en &f{billingUrl}&7 y ejecuta &e/nmod test hello&7."
  error-request: "{prefix} &cLa solicitud de uso fue rechazada, pero la clave no se clasificó como inválida. &7Ejecuta &e/nmod doctor&7."
mapart:
  confiscated: "{prefix} &cEse mapa contiene contenido inapropiado y ha sido retirado."
  blocked: "{prefix} &cEse mapa está marcado como inapropiado y no se puede usar."
mute:
  blocked: "&cEstás silenciado por &f{duration}&c."
alert:
  monitor: "{prefix} &e&lMONITOR &7{player} &8[&7{surface}&8] &f{message} &8(&7{reason}&8) &7activaría: &e{actions}"
  enforce: "{prefix} &c&lDETECTADO &7{player} &8[&7{surface}&8] &f{message} &8(&7{reason}&8) &7-> &c{actions}"
surface:
  blocked: "{prefix} &cEse texto contiene contenido bloqueado."
allow:
  usage: "{prefix} &cUso: &e/{label} allow <word|url> <add|remove|list> [valor]"
mode:
  usage: "{prefix} &cUso: &e/{label} mode <monitor|enforce>"
  current: "{prefix} &7Modo: &f{value}"
  stats: "{prefix} &7Detecciones desde el inicio (&f{hours}h&7): &b{total}"
  stats-line: "&8  - &7{reason}: &b{count}"
  set-monitor: "{prefix} &eModo monitor activado. &7Las detecciones se registran y avisan, pero no se bloquea ni castiga. Usa &e/nmod mode enforce &7cuando estés listo."
  set-enforce: "{prefix} &aModo enforce activado. &7El contenido marcado se bloquea y se ejecutan las acciones."
test:
  usage: "{prefix} &cUso: &e/{label} test <mensaje>&7. Primera prueba: &e/{label} test badword &7(previsualización segura; el modo monitor nunca bloquea)."
  title: "{prefix} &7Probando: &f{message}"
  disabled: "{prefix} &7La moderación está &cdesactivada&7, así que el mensaje no se comprobaría."
  local-flagged: "{prefix} &7Reglas locales: &cDETECTADO &8(&7{reason}&8)"
  local-clear: "{prefix} &7Reglas locales: &alimpio"
  cloud-checking: "{prefix} &7Nube: &7comprobando..."
  cloud-flagged: "{prefix} &7Nube: &cDETECTADO &8(&7{ms}ms&8)"
  cloud-clear: "{prefix} &7Nube: &alimpio &8(&7{ms}ms&8)"
  cloud-error: "{prefix} &7Nube: &eerror temporal de red/servidor &8(&7{ms}ms&8)&7. Ejecuta &e/nmod doctor&7."
  cloud-auth: "{prefix} &7Nube: &cclave API rechazada &8(&7{ms}ms&8)&7. Sustitúyela en &f{url}&7 y ejecuta &e/nmod setup <key>&7."
  cloud-credits: "{prefix} &7Nube: &ccréditos insuficientes &8(&7{ms}ms&8)&7. Añade créditos en &f{url}&7 y ejecuta &e/nmod test hello&7."
  cloud-request-error: "{prefix} &7Nube: &csolicitud rechazada &8(&7{ms}ms&8)&7, pero la clave no se clasificó como inválida. Ejecuta &e/nmod doctor&7."
  cloud-skipped-local: "{prefix} &7Nube: &8omitida (las reglas locales ya lo detectaron)"
  cloud-skipped-key: "{prefix} &7Nube: &8omitida (sin clave API; solo reglas locales). &7Regístrate en &f{url}&7, crea una clave y ejecuta &e/nmod setup <key>&7."
  cloud-skipped-circuit: "{prefix} &7Nube: &8omitida (pausada por errores; /nmod reload para reintentar)"
  would-allowed: "{prefix} &7Resultado: &apermitido"
  would-monitor: "{prefix} &7Resultado: &esolo alerta de monitor &7(sin bloqueo ni sanción)"
  would-enforce: "{prefix} &7Resultado: &cbloqueado&7; acciones: &c{actions}"
  note: "{prefix} &8Esta prueba usó una solicitud de nube. No se ejecutaron acciones."
doctor:
  title: "&8&m----------&r &x&0&0&F&F&A&A&lNeoModeration Doctor &8&m----------"
  pass: "&a[OK] &7{check}&8: &f{detail}"
  warn: "&e[!!] &7{check}&8: &f{detail}"
  fail: "&c[XX] &7{check}&8: &f{detail}"
  checking-cloud: "{prefix} &7Comprobando la cuenta y el uso (los eventos de moderación se informan por separado)..."
privacy:
  title: "&8&m----------&r &x&0&0&F&F&A&A&lPrivacidad NeoModeration &8&m----------"
  headline: "&7Protección: &f{value}"
  local: "&7Las reglas de palabras/URL se ejecutan en este servidor. Ese chat nunca sale de él."
  cloud: "&7Con clave API, el chat verificado y las imágenes de mapas se envían a &f{endpoint} &7con el nombre y UUID del jugador."
  no-cloud: "&7No hay clave API, así que no se envía ningún chat ni imagen de mapa fuera del servidor."
  retention: "&7Las solicitudes usan &fno_store&7: no se retienen, no se usan para entrenar, sin detalles de análisis."
  timeout: "&7Esperas de nube: &f{connect}ms &7conexión, &f{read}ms &7lectura (tope 2,5s). Si no responde: &f{policy}&7."
  mode: "&7Modo: &f{value}"
  metrics: "&7Las métricas técnicas de bStats no contienen chats y se pueden desactivar en &fplugins/bStats/config.yml&7."
cases:
  title: "&8&m----------&r &x&0&0&F&F&A&A&lCasos Recientes &8&m----------"
  line: "&8#&b{id} &7{player} &8[&7{surface}&8] &7{reason} &8-> &c{actions} &8({mode}, hace {ago})"
  preview: " &8> &f{value}"
  empty: "{prefix} &7Aún no hay casos registrados."
  not-found: "{prefix} &cNo existe el caso &f{id}&c."
  disabled: "{prefix} &7El historial de casos está desactivado (moderation.cases.enabled)."
  unavailable: "{prefix} &cEl historial de casos no está disponible (sin controlador SQLite)."
preset:
  usage: "{prefix} &cUso: &e/{label} preset <family|community|minimal>"
  list-title: "&8&m----------&r &x&0&0&F&F&A&A&lPreajustes &8&m----------"
  list-item: "&b{name} &8- &7{summary}"
  applied: "{prefix} &aPreajuste &f{name}&a aplicado. &7Categorías activas: &b{categories}&7, acciones: &c{actions}&7. El modo y las reglas locales no cambiaron."
